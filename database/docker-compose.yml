version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: factory_mysql
    restart: always
    environment:
      MYSQL_DATABASE: factory_db
      MYSQL_USER: factory_user
      MYSQL_PASSWORD: factory_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_data:
