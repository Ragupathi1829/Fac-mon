<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#131a2e"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>

  <!-- Outer ring pulse glow -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>

  <!-- ECG / Pulse line -->
  <polyline
    filter="url(#glow)"
    points="8,32 16,32 20,20 24,44 28,26 32,38 36,32 44,32 48,26 52,32 56,32"
    stroke="url(#pulse)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#10b981" filter="url(#glow)" opacity="0.9"/>
</svg>