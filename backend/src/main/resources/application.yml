server:
  port: 8080

spring:
  application:
    name: factory-monitoring-backend
  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/factory_monitoring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

logging:
  level:
    root: INFO
    com.factory.monitoring: DEBUG
    org.springframework.web.socket: INFO
    org.hibernate.SQL: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Twilio SMS OTP Configuration
# Set these values via environment variables or application-local.yml
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token_here}
  phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
  enabled: ${TWILIO_ENABLED:false}   # Set to true in production with real credentials

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:3000}
